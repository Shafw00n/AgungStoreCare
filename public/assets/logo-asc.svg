<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#9C2A1E" />
      <stop offset="70%" stop-color="#7A1C12" />
      <stop offset="100%" stop-color="#55120B" />
    </radialGradient>

    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5BE" />
      <stop offset="25%" stop-color="#D8B568" />
      <stop offset="50%" stop-color="#AE853A" />
      <stop offset="75%" stop-color="#E8CE92" />
      <stop offset="100%" stop-color="#9A7228" />
    </linearGradient>

    <linearGradient id="goldRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7228" />
      <stop offset="35%" stop-color="#E9D39E" />
      <stop offset="70%" stop-color="#BA9448" />
      <stop offset="100%" stop-color="#F5E8C8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1F0805" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Base Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#bgGrad)" filter="url(#shadow)" stroke="url(#goldGrad)" stroke-width="4" />
  
  <!-- Outer Beaded / Accent Dotted Ring -->
  <circle cx="150" cy="150" r="134" fill="none" stroke="url(#goldRing)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
  
  <!-- Double Line Motif Ring (Inner) -->
  <circle cx="150" cy="150" r="126" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="150" cy="150" r="120" fill="none" stroke="url(#goldRing)" stroke-width="1" opacity="0.75" />

  <!-- Center Decorative Ribbon & Elements -->
  <!-- Top Laurel / Star Accents -->
  <g fill="url(#goldGrad)">
    <polygon points="150,42 153,51 162,51 155,57 157,66 150,60 143,66 145,57 138,51 147,51" />
    <polygon points="124,47 126,53 133,53 128,58 130,64 124,60 118,64 120,58 115,53 122,53" transform="scale(0.85) translate(28, 8)" opacity="0.8" />
    <polygon points="176,47 178,53 185,53 180,58 182,64 176,60 170,64 172,58 167,53 174,53" transform="scale(0.85) translate(28, 8)" opacity="0.8" />
  </g>

  <!-- Brand Typography -->
  <!-- EST / Care Arch Text or Tagline -->
  <path id="curveTop" d="M 60,110 A 105,105 0 0,1 240,110" fill="none" />
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="url(#goldGrad)" letter-spacing="4" text-anchor="middle">
    <textPath href="#curveTop" startOffset="50%">
      EXPERIENCED &amp; TRUSTED TECH
    </textPath>
  </text>

  <!-- Main Word "AGUNG" -->
  <text x="150" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="40" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
    AGUNG
  </text>

  <!-- Divider Ribbon -->
  <g>
    <line x1="68" y1="146" x2="114" y2="146" stroke="url(#goldGrad)" stroke-width="1.5" />
    <polygon points="117,146 122,143 127,146 122,149" fill="url(#goldGrad)" />
    <!-- Center Emblem "ASC" Monogram Badge -->
    <rect x="128" y="138" width="44" height="16" rx="4" fill="#4B0F09" stroke="url(#goldRing)" stroke-width="1" />
    <text x="150" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#F3E5BE" text-anchor="middle" letter-spacing="2">
      ASC
    </text>
    <polygon points="173,146 178,143 183,146 178,149" fill="url(#goldGrad)" />
    <line x1="186" y1="146" x2="232" y2="146" stroke="url(#goldGrad)" stroke-width="1.5" />
  </g>

  <!-- Subtitle "STORE & CARE" -->
  <text x="150" y="174" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">
    STORE &amp; CARE
  </text>

  <!-- Bottom Arch Tagline: "JUAL • BELI • SERVICE" -->
  <path id="curveBottom" d="M 52,192 A 108,108 0 0,0 248,192" fill="none" />
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="url(#goldGrad)" letter-spacing="3" text-anchor="middle">
    <textPath href="#curveBottom" startOffset="50%">
      JUAL • BELI • SERVICE
    </textPath>
  </text>

  <!-- Bottom Details: LAPTOP • PC • HP -->
  <text x="150" y="244" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#E8CE92" text-anchor="middle" letter-spacing="2" opacity="0.9">
    LAPTOP • PC • SMARTPHONE
  </text>

  <!-- Tiny Bottom Star -->
  <polygon points="150,254 152,258 157,258 153,261 155,266 150,263 145,266 147,261 143,258 148,258" fill="url(#goldGrad)" opacity="0.8" />
</svg>

